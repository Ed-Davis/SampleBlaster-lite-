name: Beta Release

# Push to a branch named test-release/<anything> (or run it from the Actions
# tab) to publish the DMG as a GitHub pre-release, tagged
# v<version>-beta-build<number>. Always a pre-release: this app can't be
# tested on a High Sierra Mac before it goes out.
#
# With these repository secrets (Settings ▸ Secrets and variables ▸ Actions)
# the app and DMG are signed with your Developer ID and notarised, so they
# open normally on every Mac. Without them the build is ad-hoc signed.
#   DEVELOPER_ID_P12           base64 of your "Developer ID Application" certificate,
#                              exported from Keychain Access as .p12
#   DEVELOPER_ID_P12_PASSWORD  the password you gave that .p12
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           your App Store Connect issuer ID
on:
  push:
    branches: [ 'test-release/**' ]
  workflow_dispatch:

# Building runs read-only; only the publish job can write, and it runs
# nothing from the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      signed: ${{ env.HAS_SIGNING }}
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the build number counts commits

      - name: Run the tests
        run: ./Tests/run-tests.sh

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$IDENTITY" ] || { echo "::error::No 'Developer ID Application' identity in DEVELOPER_ID_P12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build the app and DMG
        env:
          KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
            echo "$KEY" | base64 --decode > "$NOTARY_KEY_PATH"
          else
            echo "::warning::No signing secrets: this build is ad-hoc signed, and macOS may refuse to open it."
          fi
          ./make-app.sh
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Clean up the keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Version and build number
        id: meta
        run: |
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload the DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SampleBlaster-Lite-release
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SampleBlaster-Lite-release
          path: dist

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          TAG="v${VERSION}-beta-build${BUILD}"
          (cd dist && sha256sum *.dmg > SHA256SUMS.txt)
          if [ "$SIGNED" = "true" ]; then
            OPEN="2. It's signed with Developer ID and notarised by Apple, so it opens normally."
          else
            OPEN="2. It isn't signed with a Developer ID. If macOS won't open it, run this in Terminal, then open it again: \`xattr -cr \"/Applications/SampleBlaster Lite.app\"\`"
          fi
          cat > notes.md <<NOTES
          SampleBlaster Lite ${VERSION} beta (build ${BUILD}), from commit ${GITHUB_SHA::7}. Copyright Ed Davis 2026.

          For macOS 10.13 High Sierra and later (Intel and Apple silicon). Mounts a ZuluSCSI disk image and adds files to it, copied exactly as they are.

          **Beta: not yet tested on a High Sierra Mac.** Try it on a copy of your disk image first.

          1. Open the DMG and drag SampleBlaster Lite to Applications.
          ${OPEN}
          NOTES
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "SampleBlaster Lite ${VERSION} beta (build ${BUILD})" --notes-file notes.md
